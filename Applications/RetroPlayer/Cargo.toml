[package]
name = "retro_player"
version = "0.1.0"
edition = "2024"

[dependencies]
retro_engine = { git = "https://github.com/The-Nice-One/PlaygroundProjects" }
discord-presence = "2.1.0"
souvlaki = "0.8.3"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
kira = "0.10.4"
indexmap = "2.9.0"
rand = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.5"
log = "0.4.29"
flexi_logger = "0.31.7"
chrono = "0.4.42"
chrono-humanize = "0.2.3"
directories = "6.0.0"
anyhow = "1.0.100"
ureq = { version = "2", features = ["json", "native-tls"] }
serde_json = "1.0"
lofty = "0.21"
