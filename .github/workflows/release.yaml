name: Monorepo CI/CD

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # 1. DISCOVERY JOB
  # Scans the repository for Playground.toml files that have been modified
  # and sets up JSON arrays (matrices) for the build jobs to consume.
  # ----------------------------------------------------------------------
  prepare:
    name: Discover Changed Projects
    runs-on: ubuntu-latest
    outputs:
      desktop_projects: ${{ steps.discover.outputs.desktop_projects }}
      mobile_projects: ${{ steps.discover.outputs.mobile_projects }}
      has_desktop: ${{ steps.discover.outputs.has_desktop }}
      has_mobile: ${{ steps.discover.outputs.has_mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to diff against previous commits

      - name: Analyze Git Diff and TOML config
        id: discover
        run: |
          python -c "
          import os, json, subprocess

          # Get changed files
          before = '${{ github.event.before }}'
          if not before or before == '0000000000000000000000000000000000000000':
              cmd = ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD']
          else:
              cmd = ['git', 'diff', '--name-only', before, 'HEAD']

          try:
              changed_files = subprocess.check_output(cmd, text=True).splitlines()
          except subprocess.CalledProcessError:
              changed_files = None # Fallback to building everything if diff fails

          desktop_projects = []
          mobile_projects = []

          for root, dirs, files in os.walk('.'):
              if 'Playground.toml' in files:
                  toml_path = os.path.join(root, 'Playground.toml')

                  # Normalize directory path
                  norm_root = os.path.normpath(root)
                  if norm_root.startswith('.' + os.sep):
                      norm_root = norm_root[2:]
                  elif norm_root == '.':
                      norm_root = ''

                  # Check if the project was modified
                  is_changed = (changed_files is None)
                  if not is_changed:
                      for f in changed_files:
                          if norm_root == '' or f.startswith(norm_root + '/'):
                              is_changed = True
                              break

                  if is_changed:
                      build_type = 'rust'

                      # Safely parse TOML for build-type
                      try:
                          import tomllib
                          with open(toml_path, 'rb') as f:
                              data = tomllib.load(f)
                              build_type = data.get('github-workflow', {}).get('build-type', 'rust')
                      except Exception:
                          with open(toml_path, 'r') as f:
                              for line in f:
                                  if 'build-type' in line:
                                      parts = line.split('=')
                                      if len(parts) == 2:
                                          build_type = parts[1].strip().strip('\"\' ')

                      proj = {
                          'path': norm_root if norm_root else '.',
                          'name': os.path.basename(os.path.abspath(root)),
                          'type': build_type
                      }

                      # Distribute to matrices
                      if build_type in ['rust', 'bevy']:
                          desktop_projects.append(proj)
                      if build_type == 'bevy':
                          mobile_projects.append(proj)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'desktop_projects={json.dumps(desktop_projects)}\n')
              f.write(f'mobile_projects={json.dumps(mobile_projects)}\n')
              f.write(f'has_desktop=true\n' if desktop_projects else f'has_desktop=false\n')
              f.write(f'has_mobile=true\n' if mobile_projects else f'has_mobile=false\n')
          "

  # ----------------------------------------------------------------------
  # 2. DESKTOP BUILD JOB (Windows, macOS, Linux)
  # ----------------------------------------------------------------------
  build-desktop:
    needs: prepare
    if: needs.prepare.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project: ${{ fromJson(needs.prepare.outputs.desktop_projects) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && matrix.project.type == 'bevy' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev

      - name: Build Project
        working-directory: ${{ matrix.project.path }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ "${{ matrix.project.type }}" = "bevy" ]; then
            # Bevy Universal Binary
            SDKROOT=$(xcrun -sdk macosx --show-sdk-path) cargo build --release --target=aarch64-apple-darwin
            SDKROOT=$(xcrun -sdk macosx --show-sdk-path) cargo build --release --target=x86_64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/${{ matrix.project.name }} target/aarch64-apple-darwin/release/${{ matrix.project.name }} target/x86_64-apple-darwin/release/${{ matrix.project.name }}
          else
            # Standard Build
            cargo build --release
          fi

      - name: Prepare Artifacts (Linux / macOS Rust)
        if: matrix.os != 'windows-latest' && !(matrix.os == 'macos-latest' && matrix.project.type == 'bevy')
        shell: bash
        working-directory: ${{ matrix.project.path }}
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.project.name }} dist/
          [ -d "assets" ] && cp -r assets dist/assets || true
          [ -d "credits" ] && cp -r credits dist/credits || true
          cd dist && tar -czf ../${{ matrix.project.name }}_${{ matrix.os }}.tar.gz *

      - name: Prepare Artifacts (macOS Bevy DMG)
        if: matrix.os == 'macos-latest' && matrix.project.type == 'bevy'
        shell: bash
        working-directory: ${{ matrix.project.path }}
        run: |
          APP_NAME="${{ matrix.project.name }}"
          mkdir -p build/macos/src/$APP_NAME.app/Contents/MacOS/assets
          [ -d "assets" ] && cp -r assets/ build/macos/src/$APP_NAME.app/Contents/MacOS/assets || true
          [ -d "credits" ] && cp -r credits/ build/macos/src/$APP_NAME.app/Contents/MacOS/credits || true
          cp target/release/$APP_NAME build/macos/src/$APP_NAME.app/Contents/MacOS/
          ln -s /Applications build/macos/src/
          hdiutil create -fs HFS+ -volname "$APP_NAME" -srcfolder build/macos/src $APP_NAME.dmg

      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: ${{ matrix.project.path }}
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ matrix.project.name }}.exe" -Destination "dist/"
          if (Test-Path "assets") { Copy-Item "assets" -Destination "dist/" -Recurse }
          if (Test-Path "credits") { Copy-Item "credits" -Destination "dist/" -Recurse }
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.project.name }}_windows.zip"

      - name: Build MSI Installer (Windows Bevy)
        if: matrix.os == 'windows-latest' && matrix.project.type == 'bevy'
        shell: pwsh
        working-directory: ${{ matrix.project.path }}
        run: |
          if (Test-Path "build/windows/installer/Installer.wixproj") {
            dotnet build -c Release build/windows/installer/Installer.wixproj --output installer
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-${{ matrix.os }}-artifact
          path: |
            ${{ matrix.project.path }}/*.tar.gz
            ${{ matrix.project.path }}/*.zip
            ${{ matrix.project.path }}/*.dmg
            ${{ matrix.project.path }}/installer/**/*.msi
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # 3. MOBILE BUILD JOB (Android, iOS) - Only for Bevy
  # ----------------------------------------------------------------------
  build-mobile:
    needs: prepare
    if: needs.prepare.outputs.has_mobile == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [android, ios]
        project: ${{ fromJson(needs.prepare.outputs.mobile_projects) }}
    runs-on: ${{ matrix.target == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Add Android Target & Install cargo-apk
        if: matrix.target == 'android'
        run: |
          rustup target add aarch64-linux-android
          cargo install --force cargo-apk

      - name: Build Android
        if: matrix.target == 'android'
        working-directory: ${{ matrix.project.path }}
        run: |
          if [ -d "mobile" ]; then cd mobile; fi
          ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME cargo apk build --release

      - name: Add iOS Targets
        if: matrix.target == 'ios'
        run: rustup target add aarch64-apple-ios x86_64-apple-ios

      - name: Build iOS
        if: matrix.target == 'ios'
        working-directory: ${{ matrix.project.path }}
        run: |
          if [ -d "mobile" ] && [ -f "mobile/Makefile" ]; then
            cd mobile
            make xcodebuild-iphone-release
            mkdir -p Payload
            mv build/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || true
            zip -r ../${{ matrix.project.name }}_ios.ipa Payload
          else
            echo "No mobile/Makefile found. Skipping iOS IPA creation."
          fi

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project.name }}-${{ matrix.target }}-artifact
          path: |
            ${{ matrix.project.path }}/**/target/release/apk/*.apk
            ${{ matrix.project.path }}/*.ipa
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # 4. RELEASE JOB
  # Bundles all downloaded artifacts into a single GitHub release
  # ----------------------------------------------------------------------
  release:
    needs: [prepare, build-desktop, build-mobile]
    if: always() && (needs.prepare.outputs.has_desktop == 'true' || needs.prepare.outputs.has_mobile == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          name: Auto-Build Release (Run ${{ github.run_id }})
          body: "Automated release triggered by commit ${{ github.sha }}"
          files: artifacts/**/*
