[package]
name = "non_market_housing_simulation"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["mobile"]

[lib]
crate-type = ["rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = [
    "2d",
    "3d",
    "ui",
] }
webbrowser = { version = "1.2", features = ["hardened"] }
winit = { version = "0.30", default-features = false }
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
flate2 = { version = "1.1", features = [
    "rust_backend",
], default-features = false }
pmtiles = { version = "0.28", default-features = false, features = [
    "__async-s3-rustls",
] }
mvt-reader = "2.5"
geo-types = "0.7"
bytes = "1"
async-lock = "3"
earcutr = "0.5"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mbtiles = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Response",
    "Headers",
    "RequestInit",
    "RequestMode",
    "Navigator",
] }
send_wrapper = { version = "0.6", features = ["futures"] }
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }

[build-dependencies]
embed-resource = "1"