[package]
name = "non_market_housing_simulation"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["mobile"]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "2d_api",
    "2d_bevy_render",
    "3d_api",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "sysinfo_plugin",
    "bevy_audio",
    "vorbis",
] }
webbrowser  = "1.2.1"
flate2      = { version = "1.1", features = ["rust_backend"], default-features = false }
pmtiles     = { version = "0.23", default-features = false, features = ["__async"] }
mvt-reader  = "2.3"
geo-types   = "0.7"
bytes       = "1"
async-lock  = "3"
earcutr     = "0.4"
tokio       = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mbtiles = { version = "0.17", default-features = false }
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen             = "0.2"
wasm-bindgen-futures     = "0.4"
js-sys                   = "0.3"
web-sys                  = { version = "0.3", features = [
    "Window", "Response", "Headers", "RequestInit", "RequestMode"
] }
send_wrapper             = { version = "0.6", features = ["futures"] }
console_error_panic_hook = "0.1"

getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
embed-resource = "1"
