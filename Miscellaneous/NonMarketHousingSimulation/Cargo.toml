[package]
name = "non_market_housing_simulation"
version = "0.1.0"
edition = "2024"

# The mobile crate is a separate entry point for Android and iOS.
# It must be a workspace member so that Cargo resolves feature flags
# across both crates together — without this, `cargo apk build --package mobile`
# cannot find the root crate's workspace.
[workspace]
members = ["mobile"]

# cdylib is intentionally absent.
#
# Previously "cdylib" was listed here to support compiling the lib directly as
# a WASM module (via #[bevy_main]) and as a candidate dylib for Android.  Both
# of those roles are now gone:
#   • WASM  → trunk compiles `main.rs` as the binary entry point; no cdylib needed.
#   • Mobile → the `mobile` crate is the cdylib/staticlib; this crate is rlib only.
#
# Keeping cdylib here caused `build_rust_deps.sh` (called by Xcode) to try to
# produce a .dylib for aarch64-apple-ios, which fails because the linker picks
# up macOS SDK frameworks instead of the iOS SDK ones.
[lib]
crate-type = ["rlib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Used by the release workflow for distribution builds (--profile dist).
# Inherits release but with maximum throughput opt-level instead of size.
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = [
    "bevy/dynamic_linking",
]

# Bevy with explicit features — android-game-activity and android-native-activity
# are intentionally omitted here. They are exclusive to the `mobile` crate.
# Enabling either here would cause a Cargo feature-unification conflict when the
# `mobile` crate (which depends on android-native-activity) is built.
[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "2d_api",
    "2d_bevy_render",
    "3d_api",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "picking",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",       # internally gated on wasm32; safe to include for all targets
    "x11",
    "wayland",
    "sysinfo_plugin",
    "bevy_audio",
    "vorbis",
] }
webbrowser  = "1.2.1"
flate2      = { version = "1.1", features = ["rust_backend"], default-features = false }
pmtiles     = { version = "0.23", default-features = false, features = ["__async"] }
mvt-reader  = "2.3"
geo-types   = "0.7"
bytes       = "1"
async-lock  = "3"
earcutr     = "0.4"
tokio       = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mbtiles = { version = "0.17", default-features = false }
tokio   = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen             = "0.2"
wasm-bindgen-futures     = "0.4"
js-sys                   = "0.3"
web-sys                  = { version = "0.3", features = [
    "Window", "Response", "Headers", "RequestInit", "RequestMode"
] }
send_wrapper             = { version = "0.6", features = ["futures"] }
console_error_panic_hook = "0.1"

# Required to make `rand`/`getrandom` work on wasm.
# Backend is selected via `.cargo/config.toml` rustflags for wasm32-unknown-unknown.
getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
embed-resource = "1"
